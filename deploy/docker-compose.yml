name: svarog-core

services:
  postgres:
    image: postgres:17.7
    container_name: svarog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svarog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svarog}
      POSTGRES_DB: ${POSTGRES_DB:-svarog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svarog} -d ${POSTGRES_DB:-svarog}"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: svarog-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    depends_on:
      - loki
      - tempo
      - mimir

  loki:
    image: grafana/loki:3.2.1
    container_name: svarog-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: svarog-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP query API

  mimir:
    image: grafana/mimir:2.14.2
    container_name: svarog-mimir
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimirdata:/data
    ports:
      - "9009:9009"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: svarog-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - mimir

volumes:
  pgdata:
  lokidata:
  tempodata:
  mimirdata:
  grafanadata:
