# Mimir single-binary configuration with local filesystem storage.
# Suitable for local development; do NOT use this in production.

multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/blocks

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

ruler:
  rule_path: /data/ruler-rules
  ring:
    kvstore:
      store: memberlist
  alertmanager_url: http://localhost:9093

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler-storage

alertmanager:
  data_dir: /data/alertmanager
  external_url: http://localhost:9009/alertmanager
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager-store

store_gateway:
  sharding_ring:
    kvstore:
      store: memberlist
    replication_factor: 1

memberlist:
  bind_port: 7946

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 200000

usage_stats:
  enabled: false
