syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/Extrarius/svarog-core/api/gen/go/api/proto/auth/v1;authv1";

// AuthService provides registration and session-based authentication.
//
// Sessions are opaque cookies named "sid"; this service issues them on login
// and revokes them on logout. The current user can be inspected via Me.
service AuthService {
  // Register creates a new user account.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Login validates credentials and issues a session cookie.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // Logout revokes the current session.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // Me returns the currently authenticated user.
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }

  // ListSessions returns active sessions for the authenticated user.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/v1/sessions"
    };
  }

  // RevokeSession revokes one of the authenticated user's sessions.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {
      delete: "/v1/sessions/{session_id}"
    };
  }

  // RevokeAllOtherSessions revokes all sessions except the current one.
  rpc RevokeAllOtherSessions(RevokeAllOtherSessionsRequest) returns (RevokeAllOtherSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/revoke-others"
      body: "*"
    };
  }
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  string user_id = 1;
  string email = 2;
}

message ListSessionsRequest {}

message SessionInfo {
  string id = 1;
  string user_agent = 2;
  string ip = 3;
  string created_at = 4;
  string last_seen_at = 5;
  bool is_current = 6;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeAllOtherSessionsRequest {}

message RevokeAllOtherSessionsResponse {
  int32 revoked_count = 1;
}
